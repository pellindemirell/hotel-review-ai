  - ciddiye almamistim
  - düşünmemiştim
  - dusunmemistim
  - yaşayınca anlıyormuş
  - yasayinca anliyormus
  - paylaşmaktaki amacım
  - paylasmaktaki amacim
  - otel sahiplerinin görmelerini
  - otel sahiplerinin gormelerini
  - iyileştirmeler geri bildirim
  - iyilestirmeler geri bildirim
  - geri bildirimlerle mümkün
  - geri bildirimlerle mumkun
  - rezervasyon yapanların bilerek
  - rezervasyon yapanlarin bilerek
  - son gününde yazıyorum
  - son gununde yaziyorum
  - gece.*gün tatil
  - insan kendi yaşayınca
  - insan kendi yasayinca
  # English meta patterns
  - overall.*experience
  - all.*all
  - summary.*stay
  - would recommend
# Systemic ABSA clause pipeline — config-driven rules
# Prefer extending this file over hard-coding Crystal-specific if/else.

# Min words before meta_rescue can override a meta pattern match
meta_rescue_min_words: 3
meta_rescue_cues:
  - sıra
  - sira
  - kuyruk
  - bekle
  - otelde yoğun bir sıra
  - otelde yogun bir sira

