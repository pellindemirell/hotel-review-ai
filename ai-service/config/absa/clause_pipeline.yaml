# Systemic ABSA clause pipeline — config-driven rules
# Prefer extending this file over hard-coding Crystal-specific if/else.

version: "1.0"

# ---------------------------------------------------------------------------
# Mediocre / lukewarm sentiment class (NOT positive)
# ---------------------------------------------------------------------------
mediocre_lexicon:
  - ortalama
  - ortalamaydı
  - ortalamaydi
  - ortalamaydı
  - idare eder
  - idare ederdi
  - idarelik
  - fena değil
  - fena degil
  - eh işte
  - eh iste
  - vasat
  - vasattı
  - vasatti
  - beklediğim gibi değil
  - bekledigim gibi degil
  - pek iyi değil
  - pek iyi degil
  - öyle böyle
  - oyle boyle
  - ne iyi ne kötü
  - ne iyi ne kotu
  - orta karar
  - orta seviye
  - şöyle böyle
  - soyle boyle

mediocre_sentiment: Neutral
mediocre_score: -0.12
# If mediocre co-occurs with strong food/service noun, mild negative is allowed
mediocre_mild_negative_score: -0.18

# Bare nouns that look "positive" in lexicon but are topic words under mediocre
positive_topic_false_friends:
  - lezzet
  - lezzetli
  - yemek
  - yemekler
  - oda
  - odalar
  - hizmet
  - servis

# ---------------------------------------------------------------------------
# Meta / narrative / purpose — drop from operational ABSA table
# ---------------------------------------------------------------------------
