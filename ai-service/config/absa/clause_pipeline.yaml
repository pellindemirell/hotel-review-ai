      - pişman
      - pisman
      - değmez
      - yorgunluk
      - yorucu
      - herşey dahil
      - hersey dahil
      - ekstra karışık
      - ekstra karisik
  spa:
    blocked_departments: [spa, Spa, Spa & Wellness]
    required_cues:
      - spa
      - masaj
      - wellness
      - sauna
      - hamam
      - jakuzi
